<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#2563eb">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>發票掃描器</title>
<style>
  body{font-family:system-ui,"Noto Sans TC",sans-serif;max-width:720px;margin:0 auto;padding:16px;background:#f6f7f9;color:#222}
  h1{font-size:20px}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px #0002}
  video,canvas#prev{width:100%;border-radius:8px;background:#000}
  button{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;margin:4px 4px 4px 0}
  button.gray{background:#64748b}
  label{display:block;margin:8px 0 2px;font-size:13px;color:#555}
  input{width:100%;box-sizing:border-box;padding:8px;font-size:16px;border:1px solid #ccc;border-radius:6px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{border-bottom:1px solid #eee;padding:6px;text-align:left}
  #msg{font-size:14px;color:#b45309;min-height:20px}
</style>
</head>
<body>
<h1>發票掃描器</h1>

<div class="card">
  <video id="video" playsinline muted></video>
  <canvas id="prev" style="display:none"></canvas>
  <div>
    <button id="btnCam">開啟相機(自動掃 QR)</button>
    <button id="btnShot" class="gray">拍照 OCR(二聯/傳統/手寫)</button>
    <button id="btnFile" class="gray">上傳照片</button>
    <input type="file" id="file" accept="image/*" style="display:none">
  </div>
  <div id="msg"></div>
</div>

<div class="card">
  <label>掃描槍輸入(點這格後用 2D 掃描槍掃發票左側 QR)</label>
  <input id="scanner" placeholder="掃描槍專用">
</div>

<div class="card">
  <label>發票號碼</label><input id="f_no">
  <label>日期</label><input id="f_date" placeholder="YYYY-MM-DD">
  <label>賣方統編</label><input id="f_seller" inputmode="numeric">
  <label>買方統編(二聯式為空)</label><input id="f_buyer" inputmode="numeric">
  <label>含稅總額</label><input id="f_total" inputmode="numeric">
  <label>未稅金額</label><input id="f_sales" inputmode="numeric">
  <div style="margin-top:8px">
    <button id="btnSave">加入清單</button>
    <button id="btnCsv" class="gray">匯出 Excel</button>
  </div>
</div>

<div class="card">
  <label>Google 試算表連結(貼上 Apps Script 網頁應用程式網址,只會存在這台裝置)</label>
  <input id="sheetUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <button id="btnSheet" class="gray">儲存連結</button>
</div>

<div class="card">
  <table><thead><tr><th>號碼</th><th>日期</th><th>賣方</th><th>買方</th><th>總額</th></tr></thead>
  <tbody id="list"></tbody></table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), prev = $('prev'), msg = $('msg');
const rows = [];
let stream = null, scanning = false;

/* ---------- 電子發票 QR 解析 ----------
 左側 QR 前 77 碼:
 0-9 發票號碼 | 10-16 民國日期 | 17-20 隨機碼 | 21-28 未稅(16進位)
 29-36 含稅(16進位) | 37-44 買方統編 | 45-52 賣方統編 | 53-76 加密驗證 */
function parseEInvoice(t) {
  if (t.length < 77 || !/^[A-Z]{2}\d{8}\d{7}/.test(t)) return null;
  const roc = +t.slice(10, 13) + 1911, m = t.slice(13, 15), d = t.slice(15, 17);
  const buyer = t.slice(37, 45);
  return {
    no: t.slice(0, 10),
    date: `${roc}-${m}-${d}`,
    sales: parseInt(t.slice(21, 29), 16),
    total: parseInt(t.slice(29, 37), 16),
    buyer: buyer === '00000000' ? '' : buyer,
    seller: t.slice(45, 53)
  };
}

function fill(r) {
  $('f_no').value = r.no || '';
  $('f_date').value = r.date || '';
  $('f_seller').value = r.seller || '';
  $('f_buyer').value = r.buyer || '';
  $('f_total').value = r.total ?? '';
  $('f_sales').value = r.sales ?? '';
}

/* ---------- 解碼:優先用瀏覽器內建 BarcodeDetector,沒有就用 jsQR ---------- */
let detector = null, busy = false;
try { if ('BarcodeDetector' in window) detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {}

function jsqrCanvas(canvas) {
  const out = [];
  const tryScale = k => {
    const c = document.createElement('canvas');
    c.width = Math.round(canvas.width * k); c.height = Math.round(canvas.height * k);
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(canvas, 0, 0, c.width, c.height);
    const d = x.getImageData(0, 0, c.width, c.height);
    const code = jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptBoth' });
    if (code) out.push(code.data);
  };
  const k1 = Math.min(1, 1600 / Math.max(canvas.width, canvas.height));
  tryScale(k1);
  if (!out.length) tryScale(k1 * 0.5);
  return out;
}
async function decodeCanvas(canvas) {
  if (detector) {
    try { const r = await detector.detect(canvas); if (r.length) return r.map(b => b.rawValue); } catch (e) {}
  }
  return jsqrCanvas(canvas);
}
function handleTexts(texts) {
  for (const t of texts) {
    const r = parseEInvoice(t.trim());
    if (r) { fill(r); msg.textContent = '✅ QR 掃描成功,請確認後加入清單'; return true; }
  }
  if (texts.length) {
    const raw = texts[0];
    msg.textContent = raw.startsWith('**') ? '這是右側 QR,請改掃發票「左邊」那個' : '掃到 QR,但不是電子發票格式:' + raw.slice(0, 20);
  }
  return false;
}

/* ---------- 相機 + QR 連續掃描 ---------- */
$('btnCam').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: {
      facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 },
      advanced: [{ focusMode: 'continuous' }] } });
  } catch (e) {
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
    catch (e2) { msg.textContent = '無法開啟相機(需 HTTPS 並允許相機權限)。可改用「上傳照片」。'; return; }
  }
  video.style.display = 'block'; prev.style.display = 'none';
  video.srcObject = stream; await video.play();
  scanning = true;
  msg.textContent = '請把發票左側 QR 對準鏡頭,距離約 15–20 公分、保持不動、避開反光…';
  loop();
};
async function loop() {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA && !busy) {
    busy = true;
    const c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d', { willReadFrequently: true }).drawImage(video, 0, 0);
    const texts = await decodeCanvas(c);
    busy = false;
    if (handleTexts(texts)) { if (navigator.vibrate) navigator.vibrate(100); stopCam(); return; }
  }
  setTimeout(loop, 80);
}
function stopCam() { scanning = false; if (stream) stream.getTracks().forEach(t => t.stop()); }

/* ---------- OCR(二聯式 / 傳統 / 手寫) ---------- */
async function ocrCanvas(canvas) {
  msg.textContent = 'OCR 辨識中(第一次需下載語言檔,請稍候)…';
  const { data } = await Tesseract.recognize(canvas, 'chi_tra+eng');
  const text = data.text.replace(/[ \t]/g, '');
  const out = {};
  // 統編:「統一編號/統編」後面的 8 碼數字
  const ids = [...text.matchAll(/(?:統一?編號|統編)[::]?(\d{8})/g)].map(m => m[1]);
  if (ids.length) { out.seller = ids[0]; if (ids[1]) out.buyer = ids[1]; }
  else { const any = text.match(/\b\d{8}\b/); if (any) out.seller = any[0]; }
  // 金額:優先找「總計/合計/總額」後面的數字
  const amt = text.match(/(?:總計|合計|總額|應收|金額)[::NT\$]*([\d,]{2,})/);
  if (amt) out.total = +amt[1].replace(/,/g, '');
  // 發票號碼(傳統:2 英文 + 8 數字)
  const no = text.match(/[A-Z]{2}[-]?\d{8}/); if (no) out.no = no[0].replace('-', '');
  // 日期(民國 xxx年xx月xx日 或 西元)
  const d = text.match(/(\d{2,4})[年\/\-.](\d{1,2})[月\/\-.](\d{1,2})/);
  if (d) { let y = +d[1]; if (y < 1911) y += 1911; out.date = `${y}-${d[2].padStart(2,'0')}-${d[3].padStart(2,'0')}`; }
  fill(out);
  msg.textContent = '⚠️ OCR 結果可能有誤(尤其手寫),請逐欄核對。';
  console.log(data.text);
}
$('btnShot').onclick = async () => {
  if (!stream || !video.videoWidth) { msg.textContent = '請先開啟相機,或用「上傳照片」。'; return; }
  scanning = false;
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  stopCam(); await ocrCanvas(c);
};
$('btnFile').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  msg.textContent = '辨識 QR 中…';
  const texts = await decodeCanvas(c);
  if (handleTexts(texts)) return;
  if (!texts.length) await ocrCanvas(c);   // 找不到 QR 才改用 OCR
};

/* ---------- 掃描槍(鍵盤模式) ---------- */
$('scanner').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const r = parseEInvoice(e.target.value.trim());
  if (r) { fill(r); msg.textContent = '✅ 掃描槍讀取成功'; }
  else msg.textContent = '格式不符,請掃發票左側的 QR';
  e.target.value = '';
});

/* ---------- 加入主畫面用的 manifest ---------- */
(() => {
  const icon = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2563eb"/><text x="50" y="68" font-size="60" text-anchor="middle">🧾</text></svg>');
  const m = { name: '發票掃描器', short_name: '發票', start_url: '.', display: 'standalone',
              background_color: '#f6f7f9', theme_color: '#2563eb',
              icons: [{ src: icon, sizes: '192x192 512x512', type: 'image/svg+xml' }] };
  const l = document.createElement('link'); l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
  document.head.appendChild(l);
})();

/* ---------- 清單與 CSV ---------- */
/* ---------- 傳到 Google 試算表 ---------- */
try { $('sheetUrl').value = localStorage.getItem('sheetUrl') || ''; } catch (e) {}
$('btnSheet').onclick = () => {
  try { localStorage.setItem('sheetUrl', $('sheetUrl').value.trim()); msg.textContent = '✅ 已儲存試算表連結'; }
  catch (e) { msg.textContent = '無法儲存連結(瀏覽器禁止儲存)'; }
};
async function sendToSheet(r) {
  const url = $('sheetUrl').value.trim();
  if (!url) return false;
  try {
    await fetch(url, { method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(r) });
    return true;
  } catch (e) { return false; }
}

$('btnSave').onclick = async () => {
  const r = { no: $('f_no').value, date: $('f_date').value, seller: $('f_seller').value,
              buyer: $('f_buyer').value, total: $('f_total').value, sales: $('f_sales').value };
  rows.push(r);
  const tr = document.createElement('tr');
  [r.no, r.date, r.seller, r.buyer, r.total].forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
  $('list').appendChild(tr);
  if ($('sheetUrl').value.trim()) {
    msg.textContent = '傳送到試算表中…';
    const ok = await sendToSheet(r);
    msg.textContent = ok ? '✅ 已加入清單並送出到試算表' : '⚠️ 已加入清單,但傳送試算表失敗(請檢查網路與連結)';
  }
};
$('btnCsv').onclick = async () => {
  if (!rows.length) { msg.textContent = '清單是空的,請先加入發票'; return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('發票');
  ws.columns = [
    { header: '發票號碼', key: 'no',     width: 16 },
    { header: '日期',     key: 'date',   width: 14 },
    { header: '賣方統編', key: 'seller', width: 14 },
    { header: '買方統編', key: 'buyer',  width: 14 },
    { header: '含稅總額', key: 'total',  width: 12 },
    { header: '未稅金額', key: 'sales',  width: 12 }
  ];
  const num = v => (v === '' || v == null || isNaN(v)) ? '' : Number(v);
  rows.forEach(r => ws.addRow({ no: r.no, date: r.date, seller: r.seller, buyer: r.buyer, total: num(r.total), sales: num(r.sales) }));
  ws.getColumn('seller').numFmt = '@';   // 統編當文字,保留開頭的 0
  ws.getColumn('buyer').numFmt = '@';
  ws.eachRow(row => row.eachCell(c => { c.alignment = { horizontal: 'left', vertical: 'middle' }; }));
  ws.getRow(1).font = { bold: true };
  ws.views = [{ state: 'frozen', ySplit: 1 }];
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = 'invoices.xlsx'; a.click();
};
</script>
</body>
</html>
