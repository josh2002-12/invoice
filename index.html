<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>發票掃描器</title>
<style>
  body{font-family:system-ui,"Noto Sans TC",sans-serif;max-width:720px;margin:0 auto;padding:16px;background:#f6f7f9;color:#222}
  h1{font-size:20px}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px #0002}
  video{width:100%;border-radius:8px;background:#000;display:none}
  button{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;margin:4px 4px 4px 0}
  button.gray{background:#64748b} button.green{background:#16a34a}
  button:disabled{opacity:.5}
  label{display:block;margin:8px 0 2px;font-size:13px;color:#555}
  input{width:100%;box-sizing:border-box;padding:8px;font-size:16px;border:1px solid #ccc;border-radius:6px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{border-bottom:1px solid #eee;padding:6px;text-align:left}
  #msg{font-size:14px;color:#b45309;min-height:20px;margin-top:6px}
</style>
</head>
<body>
<h1>發票掃描器</h1>

<div class="card">
  <video id="video" playsinline muted></video>
  <div>
    <button id="btnCam">開啟相機</button>
    <button id="btnShot" class="green">📷 掃描文字</button>
    <button id="btnStop" class="gray">關閉相機</button>
    <button id="btnFile" class="gray">上傳照片</button>
    <input type="file" id="file" accept="image/*" style="display:none">
  </div>
  <div id="msg"></div>
</div>

<div class="card">
  <label>發票號碼</label><input id="f_no">
  <label>日期</label><input id="f_date" placeholder="YYYY-MM-DD">
  <label>賣方統編</label><input id="f_seller" inputmode="numeric">
  <label>買方統編(沒有就留空)</label><input id="f_buyer" inputmode="numeric">
  <label>含稅總額</label><input id="f_total" inputmode="numeric">
  <label>未稅金額</label><input id="f_sales" inputmode="numeric">
  <div style="margin-top:8px">
    <button id="btnSave">加入清單</button>
    <button id="btnXlsx" class="gray">匯出 Excel</button>
  </div>
</div>

<div class="card">
  <table><thead><tr><th>號碼</th><th>日期</th><th>賣方</th><th>買方</th><th>總額</th></tr></thead>
  <tbody id="list"></tbody></table>
</div>

<div class="card">
  <label>Apps Script 網址(文字辨識與寫入試算表都用這個,只存在這台裝置)</label>
  <input id="sheetUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <button id="btnUrl" class="gray">儲存網址</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), msg = $('msg');
const FIELDS = ['no', 'date', 'seller', 'buyer', 'total', 'sales'];
const rows = [];
let stream = null, busy = false;

/* ---------- 欄位檢查:標紅代表可能辨識錯誤 ---------- */
function validTaxId(id) {                       // 統一編號檢查碼
  if (!/^\d{8}$/.test(id)) return false;
  const w = [1, 2, 1, 2, 1, 2, 4, 1]; let sum = 0;
  for (let i = 0; i < 8; i++) { const p = +id[i] * w[i]; sum += Math.floor(p / 10) + p % 10; }
  return sum % 10 === 0 || (id[6] === '7' && (sum + 1) % 10 === 0);
}
function validDate(v) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const d = new Date(v + 'T00:00:00'); return !isNaN(d) && d.toISOString().slice(0, 10) === v;
}
const rules = {
  no: v => /^[A-Z]{2}\d{8}$/.test(v), date: validDate, seller: validTaxId, buyer: validTaxId,
  total: v => /^\d+$/.test(v), sales: v => /^\d+$/.test(v)
};
function check() {
  const bad = [];
  FIELDS.forEach(k => {
    const el = $('f_' + k), v = el.value.trim();
    const wrong = v !== '' && !rules[k](v);
    el.style.borderColor = wrong ? '#dc2626' : '#ccc';
    el.style.background = wrong ? '#fef2f2' : '#fff';
    if (wrong) bad.push(el.previousElementSibling.textContent.replace(/(.*)/, ''));
  });
  return bad.length;
}
FIELDS.forEach(k => $('f_' + k).addEventListener('input', check));

/* ---------- 相機(掃描文字時不會關閉) ---------- */
$('btnCam').onclick = async () => {
  if (stream) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: {
      facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 },
      advanced: [{ focusMode: 'continuous' }] } });
  } catch (e) {
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
    catch (e2) { msg.textContent = '無法開啟相機(需允許相機權限)。可改用「上傳照片」。'; return; }
  }
  video.srcObject = stream; video.style.display = 'block'; await video.play();
  msg.textContent = '把發票放平、對準鏡頭、文字清楚後,按「📷 掃描文字」';
};
$('btnStop').onclick = () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video.srcObject = null; video.style.display = 'none'; msg.textContent = '相機已關閉';
};
$('btnShot').onclick = () => {
  if (!stream || !video.videoWidth) { msg.textContent = '請先按「開啟相機」,或用「上傳照片」'; return; }
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  readText(c);
};
$('btnFile').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  e.target.value = ''; readText(c);
};

/* ---------- 文字辨識(AI 視覺,透過你自己的 Apps Script) ---------- */
async function readText(canvas) {
  const url = $('sheetUrl').value.trim();
  if (!url) { msg.textContent = '請先在最下方貼上 Apps Script 網址並儲存'; return; }
  if (busy) return;
  busy = true; $('btnShot').disabled = true; msg.textContent = '🤖 辨識文字中,請稍候…';
  try {
    const k = Math.min(1, 1280 / Math.max(canvas.width, canvas.height));
    const c = document.createElement('canvas');
    c.width = Math.round(canvas.width * k); c.height = Math.round(canvas.height * k);
    c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
    const b64 = c.toDataURL('image/jpeg', 0.85).split(',')[1];
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'ocr', image: b64 }) });
    const r = await res.json();
    if (r.error) { msg.textContent = '⚠️ 辨識失敗:' + String(r.error).slice(0, 80); return; }
    FIELDS.forEach(k2 => { $('f_' + k2).value = r[k2] == null ? '' : String(r[k2]).replace(/[,\s]/g, ''); });
    const n = check();
    msg.textContent = n ? `⚠️ 有 ${n} 個欄位(標紅)可能有誤,請對照發票修正` : '✅ 辨識完成,請對照發票核對後按「加入清單」';
  } catch (e) {
    msg.textContent = '⚠️ 無法連線辨識服務,請確認網址與網路';
  } finally { busy = false; $('btnShot').disabled = false; }
}

/* ---------- 加入清單 → 寫入試算表 ---------- */
$('btnSave').onclick = async () => {
  const r = {}; FIELDS.forEach(k => r[k] = $('f_' + k).value.trim());
  if (!r.no && !r.total) { msg.textContent = '請先掃描或輸入發票資料'; return; }
  rows.push(r);
  const tr = document.createElement('tr');
  [r.no, r.date, r.seller, r.buyer, r.total].forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
  $('list').appendChild(tr);
  FIELDS.forEach(k => $('f_' + k).value = ''); check();
  const url = $('sheetUrl').value.trim();
  if (!url) { msg.textContent = '已加入清單(尚未設定試算表網址,未寫入試算表)'; return; }
  msg.textContent = '寫入試算表中…';
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(r) });
    const t = (await res.text()).trim();
    msg.textContent = t === 'ok' ? '✅ 已寫入試算表' : t === 'dup' ? '⚠️ 試算表已有相同發票號碼,未重複寫入' : '⚠️ 試算表回應:' + t.slice(0, 60);
  } catch (e) { msg.textContent = '⚠️ 已送出,但無法確認結果,請到試算表檢查'; }
};

/* ---------- 匯出 Excel(欄寬、靠左、統編保留 0) ---------- */
$('btnXlsx').onclick = async () => {
  if (!rows.length) { msg.textContent = '清單是空的'; return; }
  const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet('發票');
  ws.columns = [
    { header: '發票號碼', key: 'no', width: 16 }, { header: '日期', key: 'date', width: 14 },
    { header: '賣方統編', key: 'seller', width: 14 }, { header: '買方統編', key: 'buyer', width: 14 },
    { header: '含稅總額', key: 'total', width: 12 }, { header: '未稅金額', key: 'sales', width: 12 }];
  const num = v => (v === '' || isNaN(v)) ? '' : Number(v);
  rows.forEach(r => ws.addRow({ ...r, total: num(r.total), sales: num(r.sales) }));
  ws.getColumn('seller').numFmt = '@'; ws.getColumn('buyer').numFmt = '@';
  ws.eachRow(row => row.eachCell(c => { c.alignment = { horizontal: 'left', vertical: 'middle' }; }));
  ws.getRow(1).font = { bold: true }; ws.views = [{ state: 'frozen', ySplit: 1 }];
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = 'invoices.xlsx'; a.click();
};

/* ---------- 網址設定 ---------- */
try { $('sheetUrl').value = localStorage.getItem('sheetUrl') || ''; } catch (e) {}
$('btnUrl').onclick = () => {
  try { localStorage.setItem('sheetUrl', $('sheetUrl').value.trim()); msg.textContent = '✅ 已儲存網址'; }
  catch (e) { msg.textContent = '無法儲存(瀏覽器禁止儲存)'; }
};
</script>
</body>
</html>
